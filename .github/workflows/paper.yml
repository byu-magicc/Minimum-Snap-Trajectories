name: JOSS paper draft

# Builds paper/paper.md into the PDF JOSS would publish, using the Open Journals draft action.
# Download it from the run's "Artifacts" section (named "paper").

on:
  push:
    paths: ['paper/**', '.github/workflows/paper.yml']
  pull_request:
    paths: ['paper/**', '.github/workflows/paper.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    name: Build draft PDF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
