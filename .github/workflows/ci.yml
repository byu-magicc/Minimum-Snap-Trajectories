name: CI

# Builds the C++ engine exactly as the README documents (default CMake options), then runs the
# GoogleTest suite and the minimal_planner_loop example, on a clean Ubuntu machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OSQP_VERSION: v1.0.0

jobs:
  cpp:
    name: C++ build & test (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libeigen3-dev libgtest-dev

      # OSQP is not packaged for apt. Build it once (source + build tree are cached), then
      # install it to /usr/local every run, exactly as the README instructs.
      - name: Cache OSQP build
        id: cache-osqp
        uses: actions/cache@v6
        with:
          path: ~/osqp
          key: osqp-${{ env.OSQP_VERSION }}-ubuntu-24.04

      - name: Build OSQP
        if: steps.cache-osqp.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$OSQP_VERSION" --recursive https://github.com/osqp/osqp ~/osqp
          cmake -S ~/osqp -B ~/osqp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ~/osqp/build -j"$(nproc)"

      - name: Install OSQP
        run: sudo cmake --install ~/osqp/build && sudo ldconfig

      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build cpp/build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir cpp/build --output-on-failure -j"$(nproc)"

      - name: Run example
        run: timeout 300 cpp/build/minimal_planner_loop
