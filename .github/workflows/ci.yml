name: CI

# cpp:       the README's build with system dependencies (apt Eigen, OSQP installed from
#            source), Ubuntu only.
# cpp-cross: the same default build on Linux, macOS and Windows with nothing preinstalled, so
#            Eigen, OSQP and GoogleTest are downloaded by the build itself.
# python:    `pip install .` + pytest on all three OSes, i.e. what a user of the Python
#            package actually runs (this is also the path PyPI wheels will take).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OSQP_VERSION: v1.0.0

jobs:
  cpp:
    name: C++ build & test (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libeigen3-dev libgtest-dev

      # OSQP is not packaged for apt. Build it once (source + build tree are cached), then
      # install it to /usr/local every run, exactly as the README instructs.
      - name: Cache OSQP build
        id: cache-osqp
        uses: actions/cache@v6
        with:
          path: ~/osqp
          key: osqp-${{ env.OSQP_VERSION }}-ubuntu-24.04

      - name: Build OSQP
        if: steps.cache-osqp.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$OSQP_VERSION" --recursive https://github.com/osqp/osqp ~/osqp
          cmake -S ~/osqp -B ~/osqp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ~/osqp/build -j"$(nproc)"

      - name: Install OSQP
        run: sudo cmake --install ~/osqp/build && sudo ldconfig

      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build cpp/build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir cpp/build --output-on-failure -j"$(nproc)"

      - name: Run example
        run: timeout 300 cpp/build/minimal_planner_loop

  cpp-cross:
    name: C++ build & test (${{ matrix.os }}, bundled deps)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release

      # --config is for multi-config generators (Visual Studio); ignored elsewhere.
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4

      - name: Run example
        shell: bash
        timeout-minutes: 5
        run: |
          if [ -f build/Release/minimal_planner_loop.exe ]; then
            build/Release/minimal_planner_loop.exe
          else
            build/minimal_planner_loop
          fi

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Exactly the user's install. Verbose so a build failure shows the compiler output.
      - name: pip install
        run: python -m pip install -v ".[test]"

      - name: Import from outside the repo
        working-directory: ${{ runner.temp }}
        run: python -c "import coast_planner; print(coast_planner.__version__, coast_planner.__file__)"

      - name: Tests
        run: python -m pytest python/tests -v
